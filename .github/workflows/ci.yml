name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Core tests
        run: pnpm --filter core test

      - name: Lint
        run: pnpm --filter web lint

      - name: Build
        run: pnpm --filter web build

      # The service role key bypasses Row Level Security. If it ever reaches the
      # client bundle the whole database is exposed, so fail loudly here.
      - name: No service role key in the client bundle
        run: |
          if grep -rl "SUPABASE_SERVICE_ROLE_KEY" apps/web/.next/static 2>/dev/null; then
            echo "::error::Service role key found in client bundle"
            exit 1
          fi
          echo "Clean."
